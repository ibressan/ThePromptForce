name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch content from private repos
        working-directory: ${{ github.workspace }}
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          NEWS_REPO: ${{ secrets.NEWS_REPO }}
          BLOG_REPO: ${{ secrets.BLOG_REPO }}
          COVERS_REPO: ${{ secrets.COVERS_REPO }}
          AUDIO_REPO: ${{ secrets.AUDIO_REPO }}
        run: |
          set -euo pipefail

          mkdir -p site/public/content/news/covers site/public/content/news/audio site/public/content/blog

          git clone --depth 1 \
            "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/${NEWS_REPO}.git" \
            /tmp/tpf-news
          cp -R /tmp/tpf-news/editions site/public/content/news/
          cp /tmp/tpf-news/sources.json site/public/content/news/

          git clone --depth 1 \
            "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/${BLOG_REPO}.git" \
            /tmp/tpf-blog
          cp -R /tmp/tpf-blog/blog/. site/public/content/blog/
          rm -f site/public/content/blog/README.md

          # Covers/Audio: generated media, published by ThePromptForce-News/script.py
          # (Nano Banana cover images, Gemini TTS audio editions). Best-effort by
          # design there, so these repos may only have their initial README for a
          # while — copy whatever exists and move on.
          git clone --depth 1 \
            "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/${COVERS_REPO}.git" \
            /tmp/tpf-covers
          find /tmp/tpf-covers -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
            -exec cp {} site/public/content/news/covers/ \;

          git clone --depth 1 \
            "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/${AUDIO_REPO}.git" \
            /tmp/tpf-audio
          find /tmp/tpf-audio -maxdepth 1 -type f -iname '*.wav' \
            -exec cp {} site/public/content/news/audio/ \;

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: site
        run: npm install

      - name: Build with vite
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
