name: Weekly Salesforce News Summary

on:
  schedule:
    # Every Monday at 11:00 UTC (08:00 BRT / UTC-3)
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

jobs:
  generate-and-publish-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository (bot)
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection, generation and distribution script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
          PUBLIC_REPO_URL: ${{ secrets.PUBLIC_REPO_URL }}
        run: python script.py
