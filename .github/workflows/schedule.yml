name: Salesforce News Summary

on:
  schedule:
    # Fires every Monday at 11:00 UTC (08:00 BRT / UTC-3), but script.py's
    # is_biweekly_scheduled_week() skips odd ISO weeks — net effect: runs biweekly.
    # Cadence isn't final yet; change the gating logic in script.py if this becomes
    # weekly again, no need to touch this cron expression.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only generate the summary (no Telegram/email, no commit)"
        required: false
        default: "false"
      list_models:
        description: "Debug: list Gemini models available to this API key and exit"
        required: false
        default: "false"
      skip_notifications:
        description: "Publish only: generate and commit, but skip Telegram/email"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate-and-publish-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection, generation and distribution script
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIST_MODELS: ${{ github.event.inputs.list_models }}
          SKIP_NOTIFICATIONS: ${{ github.event.inputs.skip_notifications }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python script.py

      - name: Upload dry-run summary and cover as artifact
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-summary
          path: |
            dry_run_summary.md
            dry_run_cover.jpg
          if-no-files-found: warn
