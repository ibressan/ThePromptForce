name: Resumo Semanal Salesforce News

on:
  schedule:
    # Toda segunda-feira às 11h UTC (08h BRT / UTC-3)
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

jobs:
  gerar-e-publicar-resumo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório privado (bot)
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar script de coleta, geração e distribuição
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
          PUBLIC_REPO_URL: ${{ secrets.PUBLIC_REPO_URL }}
        run: python script.py
